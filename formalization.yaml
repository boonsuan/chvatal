automation:
  methods:
    - method: "agent"
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: >-
        Local Lean 4.33.1 and pinned mathlib, shell tools, parallel proof
        development agents, incremental builds, mathlib-style linters,
        theorem-statement checks, transitive axiom audits, and local Palomar
        Comparator, Lean replay, and NanoDa tooling.
      prompting_notes: >-
        I supplied the source paper and asked GPT-6 to formalize its results
        with readable Lean code and comments mapping declarations to the
        paper. I then asked it to prepare the repository locally for Palomar,
        to make the original authors' mathematical credit explicit, and to
        disclose that I made no mathematical contribution.
  notes: >-
    GPT-6 generated the Lean formalization, scripts, and documentation, using
    parallel agents where useful. My involvement was prompting, setting
    requirements, and maintaining the repository. The original mathematical
    proof is Chang, Liu, and Liu's, not an AI-discovered result from this
    project. Compilation and kernel replay are mechanical checks, not human
    mathematical review.

fidelity:
  divergences: >-
    The paper's cube is represented by finite subsets of an arbitrary finite
    coordinate type; Fin n gives its n-dimensional case. Statements requiring
    a star center, a minimum coordinate, or the maximal-intersecting/antipodal
    characterization explicitly require a nonempty coordinate type. This
    states the paper's implicit n >= 1 convention. The main quadratic and
    harmonic correlation inequalities also hold for zero coordinates.
    Influence is mean squared flip difference, proved equal to change
    probability for Boolean functions. The empty-index maximum is zero and
    contributes nothing to the spectral sum. Lean's zero-denominator division
    agrees with Theorem 1.2's convention. Proposition 5.3 is first proved for
    any selector contained in each nonempty index and then specialized to
    a fixed total-order maximum. Its layer-cake step is a finite positive-level
    decomposition rather than an integral, with no restriction on real
    nonnegative decreasing weights. No weakening of the advertised principal
    statements was identified by the AI-assisted checks. These checks do not
    establish that every sentence of the informal paper is correct.

review:
  status: "agent-reviewed"
  reviewers: ["GPT-6 (Codex agents)"]
  notes: >-
    Agents checked correspondence with the source, definitions, normalization,
    boundary cases, theorem statements, and axiom dependencies. No independent
    human expert review is claimed. No source-author endorsement or Palomar
    editorial review is claimed. Observed local verification outcomes and
    exact tool revisions are recorded in docs/Verification.md and logs/.
    On macOS the documented Comparator development adapter does not provide
    Linux process confinement; actual Lean replay and NanoDa still run.

alignment:
  namespace: "Chvatal"
  source_map: "docs/PaperMap.md"
  statement_file: "Challenge.lean"
  proof_module: "Solution"
  comparator_config: "comparator.json"
  note: >-
    Challenge.lean imports only mathlib and gives concrete definitions with
    independently readable statements. Its deliberate theorem holes are the
    Comparator convention. Solution never imports Challenge: it imports the
    substantive proof library and provides the expanded star-theorem wrapper.
    Comparator must compare all nine selected declarations and the definitions
    on which their statements depend.

acknowledgements: >-
  Full mathematical credit goes to Fan Chang, Hong Liu, and Miao Liu and the
  mathematical sources they cite. Lean and mathlib and their contributors
  provide the proof assistant and mathematical infrastructure. Comparator,
  lean4export, and NanoDa provide the additional checking tools.
