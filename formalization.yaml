# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A formalization of Chang, Liu, and Liu's proof of Chvátal's conjecture"
  description: >-
    A Lean 4 + mathlib formalization of Fan Chang, Hong Liu, and Miao Liu's
    paper "A proof of Chvátal's conjecture via a sharp correlation inequality"
    (arXiv:2609.19123v1). It formalizes their star theorem for hereditary set
    families, sharp Boolean Fourier correlation inequality, antipodal
    corollary, sharpness results, and weighted strengthening. The formalization
    was completely prepared by GPT-6.
  authors: ["Boon Suan Ho"]
  author_roles:
    "Boon Suan Ho": >-
      I prompted GPT-6 through Codex and maintain this repository. I made no
      mathematical contribution.
  responsible_maintainers: ["Boon Suan Ho"]
  license: "MIT"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05D05"]

sources:
  - title: "A proof of Chvátal's conjecture via a sharp correlation inequality"
    authors: ["Fan Chang", "Hong Liu", "Miao Liu"]
    id: "https://arxiv.org/abs/2609.19123v1"
    type: "paper"
    relationship: "formalizes"
    location: >-
      Theorems 1.1, 1.2, 1.4; Corollary 1.3; Theorem 2.1; Lemmas 3.1 and 3.3;
      Corollary 3.2; Propositions 4.1, 5.1, and 5.3; Remark 5.2; equations
      (1)-(18), and the closing signed-Boolean formulation in Section 5.
    author_endorsement: "other"
    note: >-
      The mathematical results and proof belong to the source authors.
      This project translates their argument into Lean using mathlib. The version-1
      paper is the fixed target; introductory results merely cited from other
      works are not additional whole-paper formalization targets. The source
      retains its arXiv license and its text is not redistributed here.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/0df444a360eaa60ab8c11dca51a86af692955474"
    relationship: "builds-on"
    note: >-
      Pinned mathematical library. The development reuses its finite-set,
      intersecting-family, finite-dimensional inner-product, and Gram-Schmidt
      results, with the normalizations and reductions needed for the paper
      proved locally.

status:
  scope: >-
    The repository contains the full source-based development, including the
    numbered results and equations mapped in docs/PaperMap.md. Comparator's
    compact statement of record selects nine principal declarations: the
    expanded star theorem (1.1), sharp inequality (1.2), antipodal corollary
    (1.3), quadratic inequality (1.4), AND equality and coefficient optimality
    (5.1), numerical counterexample (5.2), and both the weighted bound and
    weighted maximum-attainment conclusion (5.3). The intermediate results
    remain proved and axiom-audited in the library; they are not separately
    selected Comparator claims. Everything is prepared locally.
  # Deliberate statement-only holes in Challenge.lean are excluded by the schema.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
